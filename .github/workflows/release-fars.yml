name: "release-fars"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-fars:
    name: Build and release FARs
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      BAZEL: bazelisk-linux-amd64
      USE_BAZEL_VERSION: 6.4.0
      CC: gcc-10
      CXX: g++-10
      BAZEL_JOBS: 8
      FAR_ROOT: .tmp-fars

    steps:
    - uses: actions/checkout@v4
      with:
        ref: build-fix
        fetch-depth: 2

    - name: Mount bazel cache
      uses: actions/cache@v4
      with:
        path: "~/.cache/bazel"
        key: ${{ runner.os }}-bazel-fars-${{ hashFiles('WORKSPACE.bazel', 'requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-bazel-fars-
          ${{ runner.os }}-bazel-

    - name: Install bazelisk
      run: |
        curl -LO "https://github.com/bazelbuild/bazelisk/releases/latest/download/$BAZEL"
        chmod +x "$BAZEL"

    - name: Install requirements
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-10 g++-10 openjdk-17-jdk python3-dev python3-pip
        sudo python3 -m pip install --upgrade pip
        sudo python3 -m pip install -r ./requirements.txt

    - name: Cleanup disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

    - name: Build FARs
      run: ./.github/scripts/build-fars.sh

    - name: Publish releases
      env:
        GH_TOKEN: ${{ github.token }}
      run: ./.github/scripts/publish-far-releases.sh "$FAR_ROOT"
